<text x="28" y="60" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#566570" text-anchor="start">연구 코드는 확인 · 온라인 서비스와 모델 배포 구현은 확인되지 않음</text>
