<text x="381" y="753" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">확률 · 적용 임계값 · 예측 라벨 · 모델 버전</text>
<text x="381" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">플랫폼 전이 성능을 함께 설명하는 결과 계약을 설계</text>
<text x="381" y="799" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">검증 임계값 0.6과 외부 평가의 기본 predict는 서로 구분</text>
