<text x="56" y="494" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">추가 봇 데이터 재학습</text>
<text x="56" y="517" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">내부·외부 도메인 평가</text>
<rect x="365" y="385" width="270" height="175" rx="8" fill="#fffaf0" stroke="#b7802b" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="381" y="416" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#000000" text-anchor="start">모델 번들 내보내기</text>
<text x="381" y="448" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">분류기 + scaler + 특성 목록</text>
<text x="381" y="471" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">타겟·임계값·버전 메타데이터</text>
<text x="381" y="494" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">한 묶음으로 저장하는 설계</text>
<text x="381" y="517" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">최종 배포 번들 확인 안 됨</text>
<rect x="690" y="385" width="270" height="175" rx="8" fill="#fffaf0" stroke="#b7802b" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="706" y="416" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#000000" text-anchor="start">온라인 추론 실행</text>
<text x="706" y="448" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">선택한 모델·특성 버전 로드</text>
<text x="706" y="471" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">predict_proba 또는 predict</text>
<text x="706" y="494" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">확률과 결정 기준을 분리</text>
<text x="706" y="517" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">실제 API 구현은 미확인</text>
