<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="arch-mlp-service-title arch-mlp-service-desc">
<title id="arch-mlp-service-title">가짜 계정 탐지 · 서비스 연결 설계안</title>
<desc id="arch-mlp-service-desc">현재 확인된 범위는 데이터 수집·전처리·모델 비교 노트북이다. 점선 영역은 그 결과를 단일 계정 추론으로 확장할 때 필요한 설계이며 구현 완료를 뜻하지 않는다. pred_model.pkl 로드는 FileNotFoundError로 남아 있어 실제 배포 모델로 표시하지 않았다.</desc>
<rect width="1000" height="900" fill="white"/>
