<text x="56" y="141" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#000000" text-anchor="start">계정 입력 진입점</text>
<text x="56" y="173" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">플랫폼·계정 식별자</text>
<text x="56" y="196" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">요청 스키마 정의 필요</text>
<text x="56" y="219" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">서비스 인터페이스는 설계</text>
<rect x="365" y="110" width="270" height="140" rx="8" fill="#fffaf0" stroke="#b7802b" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="381" y="141" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#000000" text-anchor="start">프로필 특성 구성</text>
